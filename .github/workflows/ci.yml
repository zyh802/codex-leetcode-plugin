name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:marketplace
      - run: npm run smoke:marketplace
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e

  marketplace-platforms:
    strategy:
      fail-fast: false
      matrix:
        # Node 22.22.2 bundles node-gyp 11.5.0, which cannot detect VS 2026.
        # Keep VS 2022 for the better-sqlite3 native build.
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/runtime-bootstrap.test.ts
      - run: npm run smoke:marketplace
